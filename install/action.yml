name: Install touchgate
description: >-
  Downloads the touchgate binary of a touchgate release, checks GitHub's
  attestation that touchgate's release workflow built it, and puts it on the
  PATH.

# Pin this action to the full commit of a touchgate release, which is the
# touchgate it installs:
#
#   - uses: borink-org/touchgate/install@<commit> # v0.1.0

inputs:
  commit:
    description: >-
      The touchgate commit to install, when it is not the commit this action
      is pinned to. touchgate's reusable workflows pass their own.
    required: false
    default: ""
  from-source:
    description: >-
      Build the commit with cargo instead of downloading a release's binary,
      for a commit that is not a release, as in touchgate's own repository.
    required: false
    default: "false"
  token:
    description: The token gh reads the release and its attestation with.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
        FROM_SOURCE: ${{ inputs.from-source }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
