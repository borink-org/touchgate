[package]
name = "touchgate"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Prepares Cargo and Python releases, and lets CI publish one only after a hardware key approved it with a touch and a PIN"
repository = "https://github.com/borink-org/touchgate"
rust-version = "1.90"
keywords = ["release", "publish", "fido2", "signing", "changelog"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Reads the range of `uv_build` a Python package builds with.
pep440_rs = "0.7.3"
# Reads `cargo metadata`, for the workspace's packages and their versions.
serde_json = "1.0.151"
# Edits manifests without losing their formatting or comments.
toml_edit = "0.25.15"
# The terminal of the interactive `touchgate`, an experimental release in the
# terminal.
rustix = { version = "1.1.6", default-features = false, features = ["std", "termios"], optional = true }
# The width of text in that terminal.
unicode-width = { version = "0.2.3", optional = true }

[features]
# `touchgate` without a command, which prepares, approves and follows a
# release in the terminal. Experimental, and left out of the binaries that CI
# builds.
tui = ["dep:rustix", "dep:unicode-width"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dev-dependencies]
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
