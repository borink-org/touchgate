# The release of the Python packages of a uv workspace to PyPI, and of the
# Cargo workspace beside them to crates.io, at one version. Copy this file to
# `.github/workflows/release.yml` on the default branch and on `publish`.
# Replace the commit in each install step with the commit of a touchgate
# release, and set TOUCHGATE_KEY to the contents of your `.pub` file. Without
# crates to publish, drop the jobs `crates` and `publish-crates`.
#
# PyPI and crates.io trust this file in the `release` environment, and the
# PyPI attestations name it. Neither accepts a reusable workflow as a trusted
# publisher, so the jobs that publish must be in this file. Each step that
# does more than check out, build or upload runs a touchgate command.
name: release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: The signed approval that `touchgate approve` sends
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The public key that approves a release.
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAA... release key
  # The uv that builds and uploads the release. setup-uv checks it against
  # the checksum it knows for this version. A package built with uv_build
  # builds with the copy in this uv, which `touchgate check --build` checks.
  UV_VERSION: 0.13.6

jobs:
  # Checks the approval before anything from the commit runs. touchgate is
  # installed before the checkout and reads the commit with git only.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    permissions:
      contents: read # to fetch the default branch
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # touchgate reads the approval, the repository, the default branch and
      # the commit of this workflow from the run, and the key from
      # TOUCHGATE_KEY. It sets the output `commit` that the jobs below check
      # out.
      - id: verify
        run: touchgate verify

  # The commit is approved from here on, so building it is safe. The build
  # runs in a job that cannot get a token. For a package built with maturin,
  # build its wheels in a matrix with PyO3/maturin-action instead, and upload
  # each as an artifact named `dist-*`.
  build:
    name: Build the Python packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate check --build
      - run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-all
          path: dist
          retention-days: 7

  # Builds the crates as crates.io would, in a job that cannot get a token.
  # The build runs the build scripts and procedural macros of every
  # dependency.
  crates:
    name: Build the crates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - run: touchgate check
      - run: cargo publish --workspace --locked --dry-run

  # Publishes only once every check on the release commit has passed.
  checks:
    name: Wait for the release commit's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the release commit's check runs
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - run: touchgate wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Compiles nothing. `--no-verify` packages the checked-out sources without
  # building them, and `cargo metadata` runs no build script.
  publish-crates:
    name: Publish to crates.io
    needs: [verify, build, crates, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish-crates
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for crates.io trusted publishing
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Skips what is on crates.io already, so a release that failed halfway
      # can run again.
      - run: touchgate publish --to crates.io --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Builds nothing from the commit. touchgate checks that the built files are
  # those of the workspace's packages at this version, signs their
  # attestations and uploads them, in the order the workspace lists them.
  publish-pypi:
    name: Publish to PyPI
    needs: [verify, build, crates, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish-pypi
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for PyPI trusted publishing and the attestations
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate publish --to pypi dist

  # This job runs last, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: [verify, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Attaches the approval to the release, as touchgate-approval.txt.
      - run: touchgate github-release dist/*
        env:
          GH_TOKEN: ${{ github.token }}
