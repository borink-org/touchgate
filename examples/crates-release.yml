# The release of a Cargo workspace to crates.io. Copy this file to
# `.github/workflows/release.yml` on the default branch and on `publish`.
# Replace the commit in each install step with the commit of a touchgate
# release, and set TOUCHGATE_KEY to the contents of your `.pub` file.
#
# crates.io trusts this file in the `release` environment. Each step that
# does more than check out, build or upload runs a touchgate command.
name: release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: The signed approval that `touchgate approve` sends
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The public key that approves a release.
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAA... release key

jobs:
  # Checks the approval before anything from the commit runs. Until the
  # check passes, the commit is untrusted: a `rust-toolchain.toml`, a
  # `.cargo/config.toml` or a build script in it could fake a pass. touchgate
  # is installed before the checkout and reads the commit with git only.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    permissions:
      contents: read # to fetch the default branch
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # touchgate reads the approval, the repository, the default branch and
      # the commit of this workflow from the run, and the key from
      # TOUCHGATE_KEY. It sets the output `commit` that the jobs below check
      # out.
      - id: verify
        run: touchgate verify

  # The commit is approved from here on, so building it is safe. The build
  # runs the build scripts and procedural macros of every dependency, so it
  # runs in a job without `id-token: write`. Every step of a job with that
  # permission can ask for a crates.io token.
  build:
    name: Build the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - run: touchgate check
      - run: cargo publish --workspace --locked --dry-run

  # Publishes only once every check on the release commit has passed.
  checks:
    name: Wait for the release commit's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the release commit's check runs
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - run: touchgate wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Compiles nothing. `--no-verify` packages the checked-out sources without
  # building them, and `cargo metadata` runs no build script.
  publish:
    name: Publish to crates.io
    needs: [verify, build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for crates.io trusted publishing
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Skips what is on crates.io already, so a release that failed halfway
      # can run again.
      - run: touchgate publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # This job runs last, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: borink-org/touchgate/install@0000000000000000000000000000000000000000 # v0.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      # Attaches the approval to the release, as touchgate-approval.txt.
      - run: touchgate github-release
        env:
          GH_TOKEN: ${{ github.token }}
