name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The tests in `tests/verify.rs` run the real git and ssh-keygen.
      - run: cargo test --locked
      # touchgate.yml is the example with the install steps building from
      # source, and nothing else may differ.
      - name: Check touchgate.yml against examples/touchgate.yml
        run: >-
          diff
          <(sed -n "/^name:/,\$p" examples/touchgate.yml | grep -v "borink-org/touchgate/install@")
          <(sed -n "/^name:/,\$p" .github/workflows/touchgate.yml
          | awk "/- uses: [$]\/install\$/ { skip = 3; next } skip > 0 { skip--; next } { print }")

  # What release.yml builds, so that a release finds no surprise.
  binaries:
    name: Build for ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install 1.99.1 --profile minimal --target "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +1.99.1 build --release --locked --target "$TARGET"
      - name: Run the static binary
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          file "target/$TARGET/release/touchgate"
          && "target/$TARGET/release/touchgate" check
