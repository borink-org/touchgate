# touchgate's own copy of examples/touchgate.yml. Each install step builds
# touchgate from source at the commit that the workflow runs on, because that
# commit is not a release. CI fails if the two files differ in anything else.
name: touchgate

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 0.4.0
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    # The three default types and the label changes. Adding no-changelog then
    # runs the changelog check again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  prepare:
    name: Prepare the release
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: touchgate-prepare
      cancel-in-progress: false
    permissions:
      contents: write # to push the release branch
      pull-requests: write # to open the pull request
    steps:
      - uses: $/install
        with:
          from-source: true
      # The credentials stay, to push the release branch. They can do no more
      # than anyone who can start this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      # For a Python package, `touchgate prepare` updates uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - name: Prepare the release and open its pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: 'touchgate prepare "$VERSION" --pull-request'

  changelog:
    name: Check the changelog
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: touchgate-changelog-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # to check out the history
    steps:
      - uses: $/install
        with:
          from-source: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: touchgate check
      - name: Check for a changelog entry
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        env:
          BASE: origin/${{ github.base_ref }}
        run: 'touchgate check-entry "$BASE"'
