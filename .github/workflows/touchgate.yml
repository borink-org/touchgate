# Everything but the release itself, as a reusable workflow. Nothing here is
# trusted: `release.yml` checks the approval on its own.
#
# - Started by hand with a version, prepares the release and opens a pull
#   request for it.
# - On a push to the default branch and on a pull request, checks the
#   changelog, and that a pull request that changes a published package says
#   so under `## Unreleased`, unless it is labelled `no-changelog`.
# - On a push to the default branch that merges an approval, starts
#   `release.yml` on the `publish` branch.
#
# A repository calls this from `.github/workflows/touchgate.yml`; the README
# shows the file. touchgate is built at the commit this workflow was called
# at, `job.workflow_sha`.

name: touchgate

on:
  workflow_call:
    inputs:
      version:
        description: The version to prepare, when started by hand
        required: false
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare the release
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: touchgate-prepare
      cancel-in-progress: false
    permissions:
      contents: write # to push the release branch
      pull-requests: write # to open the pull request
    steps:
      # The credentials stay, to push the release branch. They can do no more
      # than anyone who can start this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - name: Build touchgate
        working-directory: ${{ runner.temp }}
        env:
          TOUCHGATE_REV: ${{ job.workflow_sha }}
        run: >-
          cargo install --locked --root "$RUNNER_TEMP/touchgate"
          --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - name: Prepare the release and open its pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/touchgate/bin/touchgate" prepare "$VERSION" --pull-request'

  changelog:
    name: Check the changelog
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: touchgate-changelog-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # to check out the history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build touchgate
        working-directory: ${{ runner.temp }}
        env:
          TOUCHGATE_REV: ${{ job.workflow_sha }}
        run: >-
          cargo install --locked --root "$RUNNER_TEMP/touchgate"
          --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - run: '"$RUNNER_TEMP/touchgate/bin/touchgate" check'
      - name: Check for a changelog entry
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
          && !startsWith(github.head_ref, 'release/')
        env:
          BASE: origin/${{ github.base_ref }}
        run: '"$RUNNER_TEMP/touchgate/bin/touchgate" check-entry "$BASE"'

  start:
    name: Start the release
    if: >-
      github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read # to read the merge
      actions: write # to start release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Build touchgate
        working-directory: ${{ runner.temp }}
        env:
          TOUCHGATE_REV: ${{ job.workflow_sha }}
        run: >-
          cargo install --locked --root "$RUNNER_TEMP/touchgate"
          --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
      - name: Start the release if this push merges an approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/touchgate/bin/touchgate" start --commit "$GITHUB_SHA"'
