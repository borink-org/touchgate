# touchgate's own release. `touchgate start` starts it when a merge brings in
# an approval, and the copy on `publish` runs.
#
# It builds static Linux binaries of the release, attests them with GitHub
# artifact attestations and attaches them to the GitHub release. The install
# action installs a binary only if its attestation names this file on
# `publish`. It publishes nothing to crates.io.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The merge commit of the release, on the default branch
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIPK8VZox0UVPB1gsQowDPXlOj1Z34IIJ3V4I2chFNYONAAAAC3NzaDpzaWduaW5n release key
  # The Rust version that builds the binaries.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  # Checks the approval with touchgate built from this workflow's own commit.
  # touchgate is built before the checkout and runs nothing from the release.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch the default branch
    steps:
      - name: Build touchgate
        working-directory: ${{ runner.temp }}
        run: >-
          cargo install --locked --root "$RUNNER_TEMP/touchgate"
          --git https://github.com/borink-org/touchgate --rev "$GITHUB_WORKFLOW_SHA" touchgate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: '"$RUNNER_TEMP/touchgate/bin/touchgate" verify'

  # The commit is approved from here on, so building it is safe.
  build:
    name: Build for ${{ matrix.target }}
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # to check out the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo "+$RUST_TOOLCHAIN" build --release --locked --target "$TARGET"
          && mkdir dist && cp "target/$TARGET/release/touchgate" "dist/touchgate-$TARGET"
      - name: Check the version against the changelog
        env:
          TARGET: ${{ matrix.target }}
        run: '"dist/touchgate-$TARGET" check'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touchgate-${{ matrix.target }}
          path: dist
          retention-days: 7

  checks:
    name: Wait for the merge's checks
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the merge commit's check runs
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: touchgate-x86_64-unknown-linux-musl
          path: dist
      - run: chmod +x dist/touchgate-x86_64-unknown-linux-musl
      - run: dist/touchgate-x86_64-unknown-linux-musl wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs nothing from the release. It signs that this workflow, on
  # `publish`, built these files. The build jobs run the build scripts of
  # every dependency, so they cannot get the token that signing needs.
  attest:
    name: Attest the binaries
    needs: [build, checks]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # to sign with this workflow's identity
      attestations: write # to store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: touchgate-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/touchgate-*

  # This job runs last, so a tag always names an attested release.
  github-release:
    name: Tag and release on GitHub
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: touchgate-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/touchgate-x86_64-unknown-linux-musl
      - run: dist/touchgate-x86_64-unknown-linux-musl github-release dist/touchgate-*
        env:
          GH_TOKEN: ${{ github.token }}
