# Starts `release.yml` on the publish branch when a merge into the default
# branch brings in an approval. Nothing here is trusted: `release.yml` checks
# the approval itself, so a run started without one publishes nothing.

name: start-release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: start-release-${{ github.sha }}

jobs:
  start:
    name: Start the release
    runs-on: ubuntu-latest
    permissions:
      contents: read # to read the merge
      actions: write # to start release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Start the release if this merge brings in an approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s HEAD^2 2> /dev/null || true)
          if [[ "$subject" != "Approve release"* ]]; then
            echo "No approval in this push"
            exit 0
          fi
          gh workflow run release.yml --ref publish -f commit="$GITHUB_SHA"
