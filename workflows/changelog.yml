# Checks the changelog on every push and pull request, and that a pull request
# that changes a published package says so under `## Unreleased`. Label a pull
# request `no-changelog` when it has nothing to say there.

name: changelog

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

env:
  TOUCHGATE_REV: replace-with-a-touchgate-commit
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Check the changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build touchgate
        working-directory: ${{ runner.temp }}
        run: |
          cargo install --locked --root "$RUNNER_TEMP/touchgate" \
            --git https://github.com/borink-org/touchgate --rev "$TOUCHGATE_REV" touchgate
          echo "$RUNNER_TEMP/touchgate/bin" >> "$GITHUB_PATH"
      - name: Check the changelog and the versions
        run: touchgate check
      - name: Check for a changelog entry
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
          && !startsWith(github.head_ref, 'release/')
        env:
          BASE: origin/${{ github.base_ref }}
        run: touchgate check-entry "$BASE"
